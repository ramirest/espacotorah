# Render Blueprint — Static Site (no server runtime)
# Deploy: push to GitHub, then "New +" → "Blueprint" and point to this repo.
services:
  - type: web
    name: espacotorah
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Serve the exported 404 page for unknown paths.
      - type: rewrite
        source: /404
        destination: /404.html
